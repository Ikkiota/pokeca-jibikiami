name: watch
on:
  schedule:
    - cron: "2,47 22,23,0-14 * * *"   # 日本時間 7時〜23時台、30分ごと（:02と:47。2時間ごとの地引網の :17 とぶつからない）
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: 当たりやすい型番を見張る（新しい順・上限以下）
        run: |
          node -e '
          const fs = require("fs");
          const pick = re => fs.readdirSync(".").filter(f => re.test(f)).map(f => { const m = fs.readFileSync(f, "utf8").match(/Z_GH_VER\s*=\s*.v(\d+)/); return [m ? Number(m[1]) : 0, f]; }).sort((a, b) => b[0] - a[0])[0][1];
          const js = pick(/^jibikiami.*\.js$/), gs = pick(/^tool.*\.gs$/);
          console.log("使う版：", js, "／", gs);
          fs.copyFileSync(js, "__run.js"); fs.copyFileSync(gs, "__tool.gs");'
          node __run.js
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          TOOL_CODE: __tool.gs
          MODE: watch
          WATCH_MAX: "15"
          MAX_SEARCH: "30"
          MAX_PAGES: "15"
          MINUTES: "14"
