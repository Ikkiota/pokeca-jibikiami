name: shop
on:
  schedule:
    - cron: "27 * * * *"   # 毎時27分：お店の地引網（楽天・Yahoo!ショッピングの公式API・型番リストを全部）
  workflow_dispatch:
concurrency:
  group: shop
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: お店の地引網（型番リストを楽天・Yahoo!ショッピングで探す）
        run: |
          node -e '
          const fs = require("fs");
          const pick = re => fs.readdirSync(".").filter(f => re.test(f)).map(f => { const m = fs.readFileSync(f, "utf8").match(/Z_GH_VER\s*=\s*.v(\d+)/); return [m ? Number(m[1]) : 0, f]; }).sort((a, b) => b[0] - a[0])[0][1];
          const js = pick(/^jibikiami.*\.js$/), gs = pick(/^tool.*\.gs$/);
          console.log("使う版：", js, "／", gs);
          fs.copyFileSync(js, "__run.js"); fs.copyFileSync(gs, "__tool.gs");'
          node __run.js
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          TOOL_CODE: __tool.gs
          MODE: shop
          SHOP_MAX: "1200"
          SHOP_MINUTES: "22"
