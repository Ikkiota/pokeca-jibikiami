name: jibikiami
on:
  schedule:
    - cron: "47 23 * * *"   # 日本時間 8:47
    - cron: "43 4 * * *"    # 日本時間 13:43
    - cron: "17 12 * * *"   # 日本時間 21:17
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node jibikiami.js
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          SMALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          MAX_SEARCH: "30"
          MAX_PAGES: "15"
          MINUTES: "19"
